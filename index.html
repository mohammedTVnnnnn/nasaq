<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استبيان الهوية البصرية | نسق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--g:#0c3a2e;--bg:#fff;--card:#f3f7f5;--line:#d3e0da;--txt:#0c3a2e;--mut:#4f6b61;--btn:#0c3a2e;--btnt:#fff;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#cfe5db;--bg:#07241c;--card:#0d3427;--line:#1d5240;--txt:#eaf3ef;--mut:#9dbcb0;--btn:#e9f3ee;--btnt:#0c3a2e;color-scheme:dark}}
:root[data-theme="dark"]{--g:#cfe5db;--bg:#07241c;--card:#0d3427;--line:#1d5240;--txt:#eaf3ef;--mut:#9dbcb0;--btn:#e9f3ee;--btnt:#0c3a2e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans Arabic','IBM Plex Arabic',Tahoma,Arial,sans-serif;font-weight:500;line-height:1.8}
.wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px}
header{text-align:center;padding:30px 20px 26px;background:#0c3a2e;color:#fff;border-radius:22px;margin-bottom:6px}
header img{width:200px;max-width:62%;height:auto;display:block;margin:0 auto}
h1{font-weight:700;font-size:25px;margin:16px 0 6px;color:#fff}
header p{margin:0;color:#cfe5db;font-size:15px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 22px;z-index:5}
.bar i{display:block;height:100%;width:0;background:var(--g);transition:width .3s}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.q label.t{display:block;font-weight:700;font-size:16.5px;margin-bottom:10px}
.q label.t span{display:inline-block;background:var(--g);color:var(--bg);border-radius:50%;width:28px;height:28px;line-height:28px;text-align:center;font-size:14px;margin-left:8px}
input[type=text],textarea{width:100%;font:inherit;color:var(--txt);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--g)}
textarea{min-height:90px;resize:vertical}
.opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--bg)}
.opt input{accent-color:#0c3a2e;width:18px;height:18px}
.kw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:13px;color:var(--mut);margin:6px 0 0}
.send{background:var(--g);color:var(--bg);border-radius:18px;padding:22px 18px;margin-top:22px;text-align:center}
.send h2{margin:0 0 6px;font-weight:700}
.send p{margin:0 0 14px;font-size:14.5px;opacity:.9}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btns a,.btns button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;text-decoration:none;background:var(--btn);color:var(--btnt);border:2px solid var(--bg)}
.btns .alt{background:transparent;color:var(--bg)}
input[type=file]{width:100%;font:inherit;margin-top:10px;padding:10px;border:1.5px dashed var(--line);border-radius:10px;background:var(--bg);color:var(--txt)}
#fl{font-size:13px;color:var(--mut);margin:6px 0 0}
#msg{margin-top:12px;font-size:14px;min-height:20px}
footer{text-align:center;color:var(--mut);font-size:13px;margin-top:26px}
</style>
</head>
